[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "bmad-langgraph-agent"
version = "0.1.0"
description = "Turnkey BMAD-managed LangGraph Agent Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.16,<2",
    "langchain-core>=1.6.12,<2",
    "langchain-openai>=1.7.2,<2",
    "pydantic>=2.14.1,<3",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "langgraph-cli[inmem]>=0.4.36,<0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["graphs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
